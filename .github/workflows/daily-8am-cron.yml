name: Cron Job - Daily at 8 AM

on:
  schedule:
    - cron: "0 8 * * *"

jobs:
  daily-job:
    runs-on: ubuntu-latest

    steps:
      - name: Print start message
        run: echo "Daily cron job started successfully!"

      - name: Display current date and time
        run: date

      - name: Print completion message
        run: echo "Daily cron job completed successfully!"
